<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bốc bài iu đương</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at 15% 10%, #ffd6e8, transparent 32%),
    radial-gradient(circle at 85% 15%, #dbeafe, transparent 34%),
    radial-gradient(circle at 50% 90%, #fde68a, transparent 30%),
    linear-gradient(135deg, #fff7ed, #fdf2f8);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 22px;
  color: #3b2432;
}

.app {
  width: 100%;
  max-width: 480px;
  text-align: center;
}

h1 {
  margin: 0;
  font-size: 34px;
}

.subtitle {
  margin: 8px 0 20px;
  opacity: .68;
  font-size: 15px;
}

select {
  width: 100%;
  padding: 14px 16px;
  border: 0;
  border-radius: 999px;
  background: rgba(255,255,255,.85);
  font-weight: 800;
  color: #3b2432;
  text-align: center;
  margin-bottom: 18px;
  box-shadow: 0 10px 24px rgba(120, 60, 100, .08);
}

.card-wrap {
  perspective: 1000px;
}

.card {
  min-height: 330px;
  border-radius: 34px;
  padding: 30px;
  background: rgba(255,255,255,.78);
  border: 1px solid rgba(255,255,255,.9);
  box-shadow: 0 28px 70px rgba(190, 80, 130, .22);
  backdrop-filter: blur(18px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  transition: transform .45s ease;
}

.card.flip {
  transform: rotateY(180deg);
}

.tag {
  align-self: center;
  padding: 8px 15px;
  border-radius: 999px;
  background: #fce7f3;
  color: #be185d;
  font-size: 13px;
  font-weight: 900;
  margin-bottom: 24px;
}

.question {
  font-size: 25px;
  line-height: 1.35;
  font-weight: 900;
}

.hint {
  margin-top: 20px;
  font-size: 14px;
  opacity: .55;
}

.buttons {
  margin-top: 22px;
  display: grid;
  gap: 12px;
}

button {
  border: 0;
  border-radius: 999px;
  padding: 15px 18px;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
}

.primary {
  color: white;
  background: linear-gradient(135deg, #ec4899, #8b5cf6);
  box-shadow: 0 14px 26px rgba(236,72,153,.32);
}

.secondary {
  background: white;
  color: #7c2d12;
}

.progress-text {
  margin-top: 16px;
  font-size: 14px;
  opacity: .7;
}

.progress {
  margin-top: 8px;
  height: 9px;
  background: rgba(255,255,255,.6);
  border-radius: 999px;
  overflow: hidden;
}

.bar {
  height: 100%;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(135deg, #ec4899, #8b5cf6);
  transition: width .3s ease;
}
</style>
</head>

<body>
<div class="app">
  <h1>💘 Bốc bài iu đương</h1>
  <div class="subtitle">Một cái cớ đáng yêu để hỏi nhau những thứ bình thường không dám hỏi.</div>

  <select id="category" onchange="updateProgress()">
    <option value="all">🎲 Random tất cả</option>
    <option value="warmup">🌼 Khởi động</option>
    <option value="fun">😂 Xàm xí</option>
    <option value="deep">🌙 Sâu sắc</option>
    <option value="love">💗 Yêu đương</option>
    <option value="conflict">⚡ Xung đột</option>
    <option value="future">🚀 Tương lai</option>
  </select>

  <div class="card-wrap">
    <div class="card" id="card">
      <div class="tag">Sẵn sàng chưa?</div>
      <div class="question">Bấm “Bốc câu hỏi” để bắt đầu.</div>
      <div class="hint">Không phải phỏng vấn tuyển người yêu. Thư giãn đi, hai con người nhiều cảm xúc.</div>
    </div>
  </div>

  <div class="buttons">
    <button class="primary" onclick="drawCard()">Bốc câu hỏi</button>
    <button class="secondary" onclick="resetGame()">Reset bài</button>
  </div>

  <div class="progress-text" id="progressText">Đã bốc 0 câu</div>
  <div class="progress"><div class="bar" id="bar"></div></div>
</div>

let used = [];

function getFilteredQuestions() {
  const selected = document.getElementById("category").value;
  return questions
    .map((q, i) => ({ ...q, index: i }))
    .filter(q => selected === "all" || q.cat === selected);
}

function drawCard() {
  const card = document.getElementById("card");
  card.classList.add("flip");

  setTimeout(() => {
    const filtered = getFilteredQuestions();
    const available = filtered.filter(q => !used.includes(q.index));

    if (available.length === 0) {
      card.innerHTML = `
        <div class="tag">Hết bài rồi</div>
        <div class="question">Reset đi. Tình yêu cũng cần làm mới dữ liệu.</div>
        <div class="hint">Đừng cố bốc nữa. Đây không phải máy gacha.</div>
      `;
      card.classList.remove("flip");
      updateProgress();
      return;
    }

    const pick = available[Math.floor(Math.random() * available.length)];
    used.push(pick.index);

    card.innerHTML = `
      <div class="tag">${pick.label}</div>
      <div class="question">${pick.text}</div>
      <div class="hint">Trả lời thật. Không cần hay. Không cần đúng. Đời đã đủ giả trân rồi.</div>
    `;

    card.classList.remove("flip");
    updateProgress();
  }, 220);
}

function resetGame() {
  used = [];
  document.getElementById("card").innerHTML = `
    <div class="tag">Reset xong</div>
    <div class="question">Bốc lại đi, đôi chim cu nghiệp dư.</div>
    <div class="hint">Lần này cố đừng biến một câu hỏi thành phiên tòa cảm xúc.</div>
  `;
  updateProgress();
}

function updateProgress() {
  const filtered = getFilteredQuestions();
  const selectedIndexes = filtered.map(q => q.index);
  const usedInCategory = used.filter(i => selectedIndexes.includes(i)).length;
  const total = filtered.length;
  const percent = total === 0 ? 0 : (usedInCategory / total) * 100;

  document.getElementById("progressText").innerText =
    `Đã bốc ${usedInCategory}/${total} câu trong nhóm này`;

  document.getElementById("bar").style.width = percent + "%";
}

updateProgress();
</script>

</html>
