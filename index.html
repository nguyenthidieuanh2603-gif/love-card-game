<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bốc bài iu đương</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Inter, system-ui, sans-serif;
    background:
      radial-gradient(circle at top left, #ffe4ec, transparent 35%),
      radial-gradient(circle at bottom right, #dbeafe, transparent 35%),
      linear-gradient(135deg, #fff7ed, #fdf2f8);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #3f2a35;
    padding: 24px;
  }

  .app {
    width: 100%;
    max-width: 430px;
    text-align: center;
  }

  h1 {
    font-size: 32px;
    margin-bottom: 6px;
  }

  .subtitle {
    opacity: 0.7;
    margin-bottom: 24px;
  }

  .card {
    min-height: 280px;
    padding: 28px;
    border-radius: 28px;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(18px);
    box-shadow: 0 24px 60px rgba(190, 80, 130, 0.18);
    border: 1px solid rgba(255,255,255,0.8);
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: 0.3s ease;
  }

  .card:hover {
    transform: translateY(-4px);
  }

  .tag {
    display: inline-block;
    align-self: center;
    padding: 7px 14px;
    border-radius: 999px;
    background: #fce7f3;
    color: #be185d;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 22px;
  }

  .question {
    font-size: 25px;
    line-height: 1.35;
    font-weight: 700;
  }

  .buttons {
    margin-top: 24px;
    display: grid;
    gap: 12px;
  }

  button, select {
    border: 0;
    border-radius: 999px;
    padding: 14px 18px;
    font-size: 16px;
    font-weight: 700;
  }

  button {
    cursor: pointer;
    background: linear-gradient(135deg, #ec4899, #8b5cf6);
    color: white;
    box-shadow: 0 12px 25px rgba(236, 72, 153, 0.3);
  }

  button.secondary {
    background: white;
    color: #7c2d12;
    box-shadow: none;
  }

  select {
    background: rgba(255,255,255,0.8);
    color: #3f2a35;
    text-align: center;
  }

  .counter {
    margin-top: 14px;
    font-size: 14px;
    opacity: 0.65;
  }
</style>
</head>

<body>
  <div class="app">
    <h1>💘 Bốc bài iu đương</h1>
    <div class="subtitle">Một trò chơi để tìm hiểu nhau, không phải thi vấn đáp tình cảm. Bình tĩnh.</div>

    <select id="category">
      <option value="all">🎲 Random tất cả</option>
      <option value="warmup">🌼 Khởi động</option>
      <option value="deep">🌙 Sâu sắc</option>
      <option value="love">💗 Yêu đương</option>
      <option value="conflict">⚡ Xung đột</option>
      <option value="fun">😂 Xàm xí</option>
    </select>

    <div class="card" id="card">
      <div class="tag">Sẵn sàng chưa?</div>
      <div class="question">Bấm “Bốc câu hỏi” để bắt đầu.</div>
    </div>

    <div class="buttons">
      <button onclick="drawCard()">Bốc câu hỏi</button>
      <button class="secondary" onclick="resetGame()">Reset bài</button>
    </div>

    <div class="counter" id="counter">Đã bốc 0 câu</div>
  </div>

<script>
const questions = [
  { cat: "warmup", label: "🌼 Khởi động", text: "Món ăn yêu thích nhất của anh/em là gì?" },
  { cat: "warmup", label: "🌼 Khởi động", text: "Bài hát gần đây anh/em nghe nhiều nhất?" },
  { cat: "warmup", label: "🌼 Khởi động", text: "Một hoạt động cuối tuần lý tưởng là gì?" },
  { cat: "warmup", label: "🌼 Khởi động", text: "Điều nhỏ nhặt nào làm anh/em vui gần đây?" },

  { cat: "fun", label: "😂 Xàm xí", text: "Nếu nghỉ làm 1 năm mà không lo tiền, anh/em sẽ làm gì?" },
  { cat: "fun", label: "😂 Xàm xí", text: "Nếu có một siêu năng lực vô dụng, anh/em muốn có năng lực gì?" },
  { cat: "fun", label: "😂 Xàm xí", text: "Một thói quen hơi kỳ cục của anh/em là gì?" },
  { cat: "fun", label: "😂 Xàm xí", text: "Nếu tình yêu là một món ăn, hiện tại nó là món gì?" },

  { cat: "deep", label: "🌙 Sâu sắc", text: "Gần đây anh/em đang căng thẳng vì điều gì?" },
  { cat: "deep", label: "🌙 Sâu sắc", text: "Điều gì làm anh/em cảm thấy được xoa dịu nhất?" },
  { cat: "deep", label: "🌙 Sâu sắc", text: "Có điều gì anh/em muốn cải thiện trong cuộc sống cá nhân không?" },
  { cat: "deep", label: "🌙 Sâu sắc", text: "Một nỗi sợ mà anh/em ít khi nói ra là gì?" },

  { cat: "love", label: "💗 Yêu đương", text: "Điều gì khiến anh/em cảm thấy được yêu?" },
  { cat: "love", label: "💗 Yêu đương", text: "Khoảnh khắc nào của hai đứa làm anh/em nhớ nhất?" },
  { cat: "love", label: "💗 Yêu đương", text: "Anh/em thích được quan tâm theo cách nào nhất?" },
  { cat: "love", label: "💗 Yêu đương", text: "Điều gì ở người kia khiến anh/em thấy an toàn?" },

  { cat: "conflict", label: "⚡ Xung đột", text: "Khi giận, anh/em muốn nói ngay hay cần thời gian?" },
  { cat: "conflict", label: "⚡ Xung đột", text: "Một giới hạn rất quan trọng của anh/em là gì?" },
  { cat: "conflict", label: "⚡ Xung đột", text: "Khi buồn, anh/em muốn được dỗ kiểu nào?" },
  { cat: "conflict", label: "⚡ Xung đột", text: "Điều gì dễ khiến anh/em cảm thấy bị bỏ quên?" }
];

let used = [];

function drawCard() {
  const selected = document.getElementById("category").value;

  const available = questions
    .map((q, i) => ({ ...q, index: i }))
    .filter(q => !used.includes(q.index))
    .filter(q => selected === "all" || q.cat === selected);

  if (available.length === 0) {
    document.getElementById("card").innerHTML = `
      <div class="tag">Hết bài rồi</div>
      <div class="question">Reset đi. Tình yêu cũng cần làm mới dữ liệu.</div>
    `;
    return;
  }

  const pick = available[Math.floor(Math.random() * available.length)];
  used.push(pick.index);

  document.getElementById("card").innerHTML = `
    <div class="tag">${pick.label}</div>
    <div class="question">${pick.text}</div>
  `;

  document.getElementById("counter").innerText = `Đã bốc ${used.length} câu`;
}

function resetGame() {
  used = [];
  document.getElementById("card").innerHTML = `
    <div class="tag">Reset xong</div>
    <div class="question">Bốc lại đi, đôi chim cu nghiệp dư.</div>
  `;
  document.getElementById("counter").innerText = "Đã bốc 0 câu";
}
</script>
</body>
</html>
